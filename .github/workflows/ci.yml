name: CI
on:
  push:
    branches:
      - devel
      - main
      - master
      - RELEASE_*
  pull_request:
    branches:
      - devel
      - main
      - master
      - RELEASE_*

jobs:
  bioccheck:
    uses: bioconductor/workflows/.github/workflows/bioccheck.yml@main
    with:
      error_on: warning
